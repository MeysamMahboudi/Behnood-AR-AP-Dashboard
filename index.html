  --blob1:rgba(60,140,95,.30);--blob2:rgba(190,110,50,.22);--blob3:rgba(40,90,65,.35);
  --g0:rgba(255,255,255,.04);--g1:#1d3a2a;--g2:#24563a;--g3:#2f7a50;--g4:#45a46c;--g5:#7bd8a2;--g4-ink:#0c2416;--g5-ink:#0c2416;--o1:#3b2819;--o2:#5c381d;--o3:#8c5226;--o4:#c47236;--o5:#f2aa70;--o4-ink:#2a1405;--o5-ink:#2a1405;color-scheme:dark;}
html,body{margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(900px 600px at 85% -10%,var(--blob1),transparent 60%),radial-gradient(700px 520px at 5% 30%,var(--blob2),transparent 60%),radial-gradient(800px 600px at 60% 110%,var(--blob3),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh;color:var(--fg);font-family:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;font-size:14px}
#dash-root{max-width:1200px;margin-inline:auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lk{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.lk-card{width:100%;max-width:420px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--glass-edge);border-radius:26px;padding:32px 28px;box-shadow:var(--glass-shadow-hi);display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.lk-mark{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--navy);background:color-mix(in srgb,var(--navy) 12%,transparent)}
.lk-title{margin:4px 0 0;font-size:1.35rem;font-weight:700;color:var(--navy);text-wrap:balance;line-height:1.6}
.lk-sub{margin:0;color:var(--fg-muted)}
.lk-row{display:flex;gap:8px;margin-top:8px}
.lk-input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--fg)}
.lk-input:focus-visible,.lk-btn:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.lk-btn{font:inherit;font-weight:700;padding:10px 20px;border-radius:12px;border:0;background:var(--green);color:#fff;cursor:pointer}
.lk-btn:disabled{opacity:.7;cursor:wait}
.lk-err{margin:0;color:var(--bad);font-size:.8rem}

    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
      pay = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(P.iv)}, key, b64(P.ct))));
    } catch (e) {
      err.hidden = false; btn.disabled = false; btn.textContent = 'ورود'; input.select(); return;
    }
    const root = document.getElementById('dash-root');
    root.innerHTML = pay.html; window.BH_DATA = pay.data;
    document.getElementById('bh-lock').remove(); root.hidden = false;
    const s = document.createElement('script'); s.textContent = pay.js; document.body.appendChild(s);
  }
  btn.addEventListener('click', unlock);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
  input.focus();
})();
</script>
